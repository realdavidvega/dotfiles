# GNOME Terminal uses Ctrl+Shift for editing and tab shortcuts. Physical Ctrl
# is unchanged, so readline and shell controls continue to use Ctrl directly.
[*terminal*]
meta.c = C-S-c
meta.f = C-S-f
meta.n = C-S-n
meta.t = C-S-t
meta.v = C-S-v
meta.w = C-S-w

# Common macOS-style Command shortcuts for graphical applications. The
# terminal section must come first because keyd keeps the first duplicate
# binding when more than one application filter matches.
[*]
meta.a = C-a
meta.c = C-c
meta.f = C-f
meta.l = C-l
meta.n = C-n
meta.p = C-p
meta.q = A-f4
meta.r = C-r
meta.s = C-s
meta.t = C-t
meta.v = C-v
meta.w = C-w
meta.x = C-x
meta.z = C-z
meta.tab = M-tab
