# GNOME Terminal uses Ctrl+Shift for editing and tab shortcuts. Physical Ctrl
# is unchanged, so readline and shell controls continue to use Ctrl directly.
[*terminal*]
meta.c = C-S-c
meta.f = C-S-f
meta.n = C-S-n
meta.t = C-S-t
meta.v = C-S-v
meta.w = C-S-w

# Obsidian uses Command for these shortcuts on macOS and Ctrl on Linux.
# Generic bindings below supply Command+P, N, S, F, and editing shortcuts.
[obsidian]
meta.0 = C-0
meta.b = C-b
meta.e = C-e
meta.enter = C-enter
meta.equal = C-equal
meta.g = C-g
meta.i = C-i
meta.k = C-k
meta.minus = C-minus
meta.o = C-o
meta.slash = C-slash
meta+alt.enter = C-A-enter
meta+alt.left = C-A-left
meta+alt.right = C-A-right
meta+shift.d = C-S-d
meta+shift.h = C-S-h

# Common macOS-style Command shortcuts for graphical applications. The
# terminal section must come first because keyd keeps the first duplicate
# binding when more than one application filter matches.
[*]
meta.a = C-a
meta.c = C-c
meta.comma = C-comma
meta.f = C-f
meta.l = C-l
meta.n = C-n
meta.p = C-p
meta.q = A-f4
meta.r = C-r
meta.s = C-s
meta.t = C-t
meta.v = C-v
meta.w = C-w
meta.x = C-x
meta.z = C-z
meta.tab = M-tab
