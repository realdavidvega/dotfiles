# Read authorized keys from a plaintext location as well as the home directory.
#
# /home/black is ecryptfs and unlocks only when PAM receives the login
# password. The default AuthorizedKeysFile lives inside it, so after a reboot
# with nobody logged in, sshd cannot read any key and key-based login fails.
# 00-dotfiles-remote.conf disables password and keyboard-interactive auth, so
# there is no second route in and the machine is unreachable until someone
# touches it physically.
#
# Both paths are listed rather than one. The home copy stays authoritative
# while the home is mounted, and the /etc copy answers when it is not.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u
