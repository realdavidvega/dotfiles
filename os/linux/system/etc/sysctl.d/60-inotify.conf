# The LiveSync bridge watches the vault through chokidar, which registers one
# inotify watch per file: roughly 4000 for this vault against 961 directories.
# On start it emits an add event for every one of them at once, and the default
# queue of 16384 overflows. After an overflow the Deno notify-rs thread stops
# delivering events and spins in the kernel instead, burning a full core for
# minutes with zero user time and not one log line, which on a fanless-adjacent
# 2015 MacBook means 85C and the fan pinned at maximum.
#
# 131072 leaves eight times the headroom the startup burst needs. The cost is
# kernel memory per queued event, and only while a queue is actually backed up.
fs.inotify.max_queued_events = 131072
