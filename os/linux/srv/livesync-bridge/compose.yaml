services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.hub
    image: localhost/livesync-bridge:hub
    container_name: livesync-bridge
    # Never unless-stopped. The bridge is a singleton, and the lease decides
    # which host runs it. A container that restarts itself would outvote that,
    # and two bridges authoring the same document ids into a replicated
    # database produce conflict revisions rather than contention.
    # leased-service.sh starts and stops it.
    restart: "no"
    volumes:
      - ./dat:/app/dat
      - /srv/sync/blackvault:/app/data/blackvault
      # Offline-scan state. Preserve across recreation, or the next scan
      # rebuilds it from scratch.
      - bridge_local_storage:/deno-dir/location_data
    networks:
      - personalcloud

volumes:
  bridge_local_storage:

networks:
  personalcloud:
    external: true
