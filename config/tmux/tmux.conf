# tmux configuration, managed by dotfiles.
#
# Linked to ~/.tmux.conf on every machine. Also copied, not linked, to
# /srv/services/agents/tmux.conf on the Mint hub, because that machine's home
# is ecryptfs and is unreadable until someone logs in. The same reasoning and
# the same copy-instead-of-link decision already apply to keyd's config there.
#
# Reference: doc/remote-agent-sessions.md
# Minimum tmux: 3.3 (allow-passthrough). Verified on 3.4 (Mint) and 3.7b (macOS).

# ── Agent TUI correctness ────────────────────────────────────────────────────
# Claude Code and Codex draw full-screen TUIs and emit escape sequences tmux
# would otherwise swallow.

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Let OSC sequences reach the outer terminal untouched. Without this, terminal
# titles, progress reports and desktop notifications from the agent stop at tmux.
set -g allow-passthrough on

# Distinguish Shift+Enter from Enter, which is how both agents take a newline
# inside a prompt rather than submitting it.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Esc is the interrupt key in both agents. The 500ms default makes it feel
# broken. 25ms stays responsive without splitting escape sequences arriving in
# separate packets over a relayed mobile link.
set -s escape-time 25

set -g focus-events on

# Copy from the remote tmux into the local clipboard over OSC 52, so a phone or
# a Mac gets the selection without a round trip through a file.
set -s set-clipboard on

# ── Scrollback ───────────────────────────────────────────────────────────────
# An agent run is the artifact worth keeping. 200k lines costs a few MB per
# pane and is the difference between reading what happened and guessing.
set -g history-limit 200000

# ── Attaching from more than one device ──────────────────────────────────────
# The hazard: a phone attaches, and the session shrinks to phone dimensions for
# the Mac too. `latest` hands sizing to whichever client is currently active
# instead of to the smallest one.
set -g window-size latest
setw -g aggressive-resize on

# Killing a session returns to another one rather than dropping the connection.
set -g detach-on-destroy off

# ── Mobile ergonomics ────────────────────────────────────────────────────────
# The status line goes on top because the iOS keyboard covers the bottom of the
# screen, which is where the session name and window list would otherwise be.
set -g status-position top

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Deterministic window names ───────────────────────────────────────────────
# Automatic renaming is off on purpose. Reattaching from a phone means picking a
# window from a list, and a name that tracks the running process is useless for
# that. agent-session.sh names them, and the agent cannot rewrite the name.
setw -g automatic-rename off
set -g allow-rename off

set -g set-titles on
set -g set-titles-string '#S · #W'

# ── Status line ──────────────────────────────────────────────────────────────
# Left: session name. Right: host, because these sessions are normally somebody
# else's machine and knowing which one matters.
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 60
set -g status-left  ' #[bold]#S#[default] '
set -g status-right ' #{?client_prefix,PREFIX ,}#h '
setw -g window-status-current-format ' #[bold]#I:#W#[default] '
setw -g window-status-format ' #I:#W '

# ── Keys ─────────────────────────────────────────────────────────────────────
# The prefix stays C-b. C-a is beginning-of-line in every shell here, which the
# Mint keyd config deliberately preserves, and remapping the prefix onto it
# would take that back. Change it in one place if that ever stops being true.

setw -g mode-keys vi

bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits inherit the current directory. The default does not, which in a repo
# means every new pane starts at home.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Send the whole visible buffer plus recent scrollback to a file, for reading an
# agent run in an editor instead of a pager.
bind P command-prompt -p 'save pane history to:' -I '~/tmux-pane.log' \
  'capture-pane -S -100000 ; save-buffer %1 ; delete-buffer'
